pool:
  # name: 'On-Prem DCA Azure Pipeline'
  name: 'On-Prem ADC OpenShift Agent Pool'
steps: 
- task: UseNode@1
  inputs:
    version: '18.x'
  displayName: 'Install Node.js'

#- task: NodeTool@0
#  inputs:
#    versionSpec: '20.x'
#  displayName: 'Install Node.js'

- script: |
    npm install -g newman
  displayName: 'Install Newman'

- script: |
    npm install -g newman newman-reporter-junitfull newman-reporter-htmlextra
    newman run "https://api.getpostman.com/collections/$(COLLECTION_ID)?apikey=$(POSTMAN_API_KEY)" \
    -d SampleSpotQuoteData.csv \
    --reporters cli,junit,htmlextra \
    --reporter-junit-export results/newman-junit.xml \
    --reporter-htmlextra-export results/newman-report.html
  displayName: 'Run Postman tests via Newman'


- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'results/newman-junit.xml'
    testRunTitle: 'Postman API Tests'
    failTaskOnFailedTests: true




